<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR - Physics & Drive</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
  </style>

  <!-- Three.js Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="start-btn">HOT WHEELS MR'I BAŞLAT</button>

<script>
  let scene, camera, renderer;
  let carMesh;

  // Kontrol Değişkenleri
  let isMovingForward = false;
  let isMovingBackward = false;
  let turnValue = 0;
  let speed = 0;

  // Fizik ve Ele Alma Değişkenleri
  let isGrabbed = false;
  let verticalVelocity = 0;
  const GRAVITY = -9.81;
  const FLOOR_Y = 0.0125; // Arabanın taban yüksekliği (Zemin)
  let leftController = null;
  let isSpawnedAtUser = false;

  const startBtn = document.getElementById('start-btn');

  startBtn.addEventListener('click', async () => {
    if (!navigator.xr) {
      alert('WebXR desteklenmiyor!');
      return;
    }

    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['hit-test', 'dom-overlay', 'local-floor', 'bounded-floor'],
        domOverlay: { root: document.body }
      });

      startBtn.style.display = 'none';
      initThreeJS(session);

    } catch (err) {
      alert('MR Başlatılamadı: ' + err.message);
    }
  });

  function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    // Işık
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
    scene.add(light);

    // Rip Rod Hitbox (3cm x 2.5cm x 7cm)
    const carGeometry = new THREE.BoxGeometry(0.03, 0.025, 0.07);
    const carMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    carMesh = new THREE.Mesh(carGeometry, carMaterial);
    
    // Geçici olarak sahneye ekle (İlk karede headset koordinatlarına çekilecek)
    carMesh.position.set(0, FLOOR_Y, -0.5);
    scene.add(carMesh);

    // Kumanda Temsilcileri
    leftController = renderer.xr.getController(0);
    scene.add(leftController);

    renderer.setAnimationLoop(render);
  }

  let lastTime = performance.now();

  function render(time, frame) {
    const session = renderer.xr.getSession();
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    // 1. HEADSET KOORDİNATLARINDA DOĞMA (İmha Bug'ı Çözümü)
    if (!isSpawnedAtUser && camera) {
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      
      // Eğer kamera konum almaya başladıysa arabayı doğrudan kullanıcının X ve Z hizasına koy
      if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
        carMesh.position.set(camPos.x, FLOOR_Y, camPos.z - 0.4);
        isSpawnedAtUser = true;
      }
    }

    let leftTriggerPressed = false;
    let leftControllerPos = new THREE.Vector3();

    if (session && session.inputSources) {
      isMovingForward = false;
      isMovingBackward = false;
      turnValue = 0;

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;

        // SAĞ KUMANDA (Gaz / Fren)
        if (source.handedness === 'right') {
          // Trigger (İleri)
          if (source.gamepad.buttons[0] && (source.gamepad.buttons[0].pressed || source.gamepad.buttons[0].value > 0.1)) {
            isMovingForward = true;
          }
          // Squeeze/Grip (Geri)
          if (source.gamepad.buttons[1] && (source.gamepad.buttons[1].pressed || source.gamepad.buttons[1].value > 0.1)) {
            isMovingBackward = true;
          }
        }

        // SOL KUMANDA (Direksiyon & Ele Alma)
        if (source.handedness === 'left') {
          // Direksiyon
          if (source.gamepad.axes.length >= 2) {
            const axisVal = source.gamepad.axes[2] !== undefined ? source.gamepad.axes[2] : source.gamepad.axes[0];
            if (Math.abs(axisVal) > 0.1) {
              turnValue = axisVal;
            }
          }

          // Sol Trigger (Yakalama/Tutma)
          if (source.gamepad.buttons[0] && source.gamepad.buttons[0].value > 0.1) {
            leftTriggerPressed = true;
          }
        }
      }
    }

    // 2. TUTMA VE FİZİK/YERÇEKİMİ MANTIĞI
    if (leftController) {
      leftController.getWorldPosition(leftControllerPos);
      const distanceToCar = leftControllerPos.distanceTo(carMesh.position);

      // Tutma Koşulu: El arabaya 15 cm yakındayken Sol Trigger'a basılırsa
      if (leftTriggerPressed && (distanceToCar < 0.15 || isGrabbed)) {
        isGrabbed = true;
        carMesh.position.copy(leftControllerPos);
        verticalVelocity = 0; // Hızı sıfırla
      } else {
        isGrabbed = false;
      }
    }

    // Yerçekimi Düşüşü
    if (!isGrabbed && carMesh.position.y > FLOOR_Y) {
      verticalVelocity += GRAVITY * delta;
      carMesh.position.y += verticalVelocity * delta;

      // Zemin Seviyesine Çarpma Kontrolü
      if (carMesh.position.y <= FLOOR_Y) {
        carMesh.position.y = FLOOR_Y;
        verticalVelocity = 0;
      }
    }

    // 3. SÜRÜŞ VE DÖNÜŞ FİZİĞİ (Yalnızca araba elinde değilse çalışır)
    if (!isGrabbed) {
      if (isMovingForward) {
        speed = -0.008;
      } else if (isMovingBackward) {
        speed = 0.004;
      } else {
        speed = 0;
      }

      // Keskin Dönüş
      if (speed !== 0 && Math.abs(turnValue) > 0.1) {
        const directionMultiplier = speed < 0 ? 1 : -1;
        carMesh.rotation.y -= turnValue * 0.08 * directionMultiplier;
      }

      carMesh.translateZ(speed);
    }

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
