<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR - Rip Rod</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
  </style>

  <!-- Three.js Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="start-btn">HOT WHEELS MR'I BAŞLAT</button>

<script>
  let scene, camera, renderer;
  let carMesh;

  // Kontrol Değişkenleri
  let isMovingForward = false;
  let isMovingBackward = false;
  let turnValue = 0;
  let speed = 0;

  // Quest'in Gerçek Oda Sınır Noktaları (Boundary Geometry)
  let boundaryPolygon = [];

  const startBtn = document.getElementById('start-btn');

  startBtn.addEventListener('click', async () => {
    if (!navigator.xr) {
      alert('WebXR desteklenmiyor!');
      return;
    }

    try {
      // 'bounded-floor' ile Quest'in çizili sınır haritasını istiyoruz
      const session = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['hit-test', 'dom-overlay', 'bounded-floor', 'local-floor'],
        domOverlay: { root: document.body }
      });

      startBtn.style.display = 'none';
      initThreeJS(session);

    } catch (err) {
      alert('MR Başlatılamadı: ' + err.message);
    }
  });

  async function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    
    // Öncelik Quest'in çizili sınırında (bounded-floor)
    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    // Quest Oda Sınır Geometrisini Çekme
    session.requestReferenceSpace('bounded-floor').then((refSpace) => {
      if (refSpace.boundsGeometry) {
        boundaryPolygon = Array.from(refSpace.boundsGeometry).map(pt => ({ x: pt.x, z: pt.z }));
      }
    }).catch(() => {});

    // Işık
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
    scene.add(light);

    // Rip Rod Hitbox (3cm x 2.5cm x 7cm)
    const carGeometry = new THREE.BoxGeometry(0.03, 0.025, 0.07);
    const carMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    carMesh = new THREE.Mesh(carGeometry, carMaterial);

    // Arabayı tam zemine oturt
    carMesh.position.set(0, 0.0125, -1.0);
    scene.add(carMesh);

    renderer.setAnimationLoop(render);
  }

  // Nokta Poligonun İçinde mi Kontrolü (Ray-Casting Algoritması)
  function isInsideBoundary(point, polygon) {
    if (!polygon || polygon.length < 3) return true; // Sınır çekilemediyse serbest bırak
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].x, zi = polygon[i].z;
      const xj = polygon[j].x, zj = polygon[j].z;
      const intersect = ((zi > point.z) !== (zj > point.z)) &&
          (point.x < (xj - xi) * (point.z - zi) / (zj - zi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function render(time, frame) {
    const session = renderer.xr.getSession();

    if (session && session.inputSources) {
      isMovingForward = false;
      isMovingBackward = false;
      turnValue = 0;

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;

        // SAĞ KUMANDA (İleri / Geri)
        if (source.handedness === 'right') {
          if (source.gamepad.buttons[0] && source.gamepad.buttons[0].pressed) {
            isMovingForward = true;
          }
          if (source.gamepad.buttons[1] && source.gamepad.buttons[1].pressed) {
            isMovingBackward = true;
          }
        }

        // SOL KUMANDA (Direksiyon)
        if (source.handedness === 'left') {
          if (source.gamepad.axes.length >= 2) {
            const axisVal = source.gamepad.axes[2] !== undefined ? source.gamepad.axes[2] : source.gamepad.axes[0];
            if (Math.abs(axisVal) > 0.1) {
              turnValue = axisVal;
            }
          }
        }
      }
    }

    // İlerleme Hızı
    if (isMovingForward) {
      speed = -0.008;
    } else if (isMovingBackward) {
      speed = 0.004;
    } else {
      speed = 0;
    }

    // GÜNCELLEME 1: Keskin Direksiyon Açısı (0.03'ten 0.08'e çıkarıldı - Çok daha kıvrak)
    if (speed !== 0 && Math.abs(turnValue) > 0.1) {
      const directionMultiplier = speed < 0 ? 1 : -1;
      carMesh.rotation.y -= turnValue * 0.08 * directionMultiplier;
    }

    const oldPosition = carMesh.position.clone();

    // İlerletme
    carMesh.translateZ(speed);

    // GÜNCELLEME 2: Gerçek Quest Oda Çizgisi Kontrolü
    const newPoint = { x: carMesh.position.x, z: carMesh.position.z };
    if (!isInsideBoundary(newPoint, boundaryPolygon)) {
      // Eğer araba gerçek odanın çizili sınırının dışına çıkarsa hareketi engelle
      carMesh.position.copy(oldPosition);
    }

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
