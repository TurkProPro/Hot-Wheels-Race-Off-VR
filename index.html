<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    #start-btn {
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
    }
  </style>
</head>
<body>

  <h1>HOT WHEELS MR BAŞLATICI</h1>
  <p>Aşağıdaki butona basarak Karma Gerçeklik moduna geçebilirsin.</p>
  <button id="start-btn">KARMA GERÇEKLİĞİ (MR) BAŞLAT</button>

<script>
  const button = document.getElementById('start-btn');

  // WebXR Kontrolü
  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (!supported) {
        button.innerText = 'Cihazınız AR/MR Desteklemiyor!';
        button.style.backgroundColor = '#ff4444';
      }
    });
  } else {
    button.innerText = 'WebXR Desteği Bulunamadı (HTTPS Gereklidir)';
    button.style.backgroundColor = '#ff4444';
  }

  button.addEventListener('click', async () => {
    if (!navigator.xr) return;

    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['hit-test', 'dom-overlay'],
        domOverlay: { root: document.body }
      });

      button.style.display = 'none';

      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl', { xrCompatible: true });
      document.body.appendChild(canvas);

      await session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
      const refSpace = await session.requestReferenceSpace('local');

      function onXRFrame(time, frame) {
        session.requestAnimationFrame(onXRFrame);
        const pose = frame.getViewerPose(refSpace);

        if (pose) {
          const glLayer = session.renderState.baseLayer;
          gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);

          // Ekranı temizle -> Kameraların görünmesini sağlayan şeffaf arka plan
          gl.clearColor(0.0, 0.0, 0.0, 0.0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        }
      }

      session.requestAnimationFrame(onXRFrame);

    } catch (err) {
      alert('MR Başlatma Hatası: ' + err.message);
    }
  });
</script>
</body>
</html>
