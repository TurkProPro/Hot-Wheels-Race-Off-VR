<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="start-btn">HOT WHEELS MR'I BAŞLAT</button>

<script>
  var scene, camera, renderer;
  var carMesh;

  var isMovingForward = false;
  var isMovingBackward = false;
  var turnValue = 0;
  var speed = 0;

  var isGrabbed = false;
  var verticalVelocity = 0;
  var GRAVITY = -9.81;
  var FLOOR_Y = 0.0125;
  var leftController = null;
  var isSpawnedAtUser = false;

  var startBtn = document.getElementById('start-btn');

  startBtn.addEventListener('click', function() {
    if (!navigator.xr) {
      alert('WebXR desteklenmiyor!');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'dom-overlay', 'local-floor', 'bounded-floor'],
      domOverlay: { root: document.body }
    }).then(function(session) {
      startBtn.style.display = 'none';
      initThreeJS(session);
    }).catch(function(err) {
      alert('MR Başlatılamadı: ' + err.message);
    });
  });

  function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    var light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
    scene.add(light);

    var carGeometry = new THREE.BoxGeometry(0.03, 0.025, 0.07);
    var carMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    carMesh = new THREE.Mesh(carGeometry, carMaterial);
    
    carMesh.position.set(0, FLOOR_Y, -0.5);
    scene.add(carMesh);

    leftController = renderer.xr.getController(0);
    scene.add(leftController);

    renderer.setAnimationLoop(render);
  }

  var lastTime = performance.now();

  function render(time, frame) {
    var session = renderer.xr.getSession();
    var delta = (time - lastTime) / 1000;
    lastTime = time;

    if (!isSpawnedAtUser && camera) {
      var camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      
      if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
        carMesh.position.set(camPos.x, FLOOR_Y, camPos.z - 0.4);
        isSpawnedAtUser = true;
      }
    }

    var leftTriggerPressed = false;
    var leftControllerPos = new THREE.Vector3();

    if (session && session.inputSources) {
      isMovingForward = false;
      isMovingBackward = false;
      turnValue = 0;

      for (var i = 0; i < session.inputSources.length; i++) {
        var source = session.inputSources[i];
        if (!source.gamepad) continue;

        if (source.handedness === 'right') {
          if (source.gamepad.buttons[0] && (source.gamepad.buttons[0].pressed || source.gamepad.buttons[0].value > 0.1)) {
            isMovingForward = true;
          }
          if (source.gamepad.buttons[1] && (source.gamepad.buttons[1].pressed || source.gamepad.buttons[1].value > 0.1)) {
            isMovingBackward = true;
          }
        }

        if (source.handedness === 'left') {
          if (source.gamepad.axes.length >= 2) {
            var axisVal = source.gamepad.axes[2] !== undefined ? source.gamepad.axes[2] : source.gamepad.axes[0];
            if (Math.abs(axisVal) > 0.1) {
              turnValue = axisVal;
            }
          }

          if (source.gamepad.buttons[0] && source.gamepad.buttons[0].value > 0.1) {
            leftTriggerPressed = true;
          }
        }
      }
    }

    if (leftController) {
      leftController.getWorldPosition(leftControllerPos);
      var distanceToCar = leftControllerPos.distanceTo(carMesh.position);

      if (leftTriggerPressed && (distanceToCar < 0.15 || isGrabbed)) {
        isGrabbed = true;
        carMesh.position.copy(leftControllerPos);
        verticalVelocity = 0;
      } else {
        isGrabbed = false;
      }
    }

    if (!isGrabbed && carMesh.position.y > FLOOR_Y) {
      verticalVelocity += GRAVITY * delta;
      carMesh.position.y += verticalVelocity * delta;

      if (carMesh.position.y <= FLOOR_Y) {
        carMesh.position.y = FLOOR_Y;
        verticalVelocity = 0;
      }
    }

    if (!isGrabbed) {
      if (isMovingForward) {
        speed = -0.008;
      } else if (isMovingBackward) {
        speed = 0.004;
      } else {
        speed = 0;
      }

      if (speed !== 0 && Math.abs(turnValue) > 0.1) {
        var directionMultiplier = speed < 0 ? 1 : -1;
        carMesh.rotation.y -= turnValue * 0.08 * directionMultiplier;
      }

      carMesh.translateZ(speed);
    }

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
