<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR - Acceleracers Reverb (3D Controller Menu)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
    #loading-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #00ffcc;
      z-index: 9999;
    }
  </style>

  <!-- Three.js ve GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <button id="start-btn" style="display:none;">HOT WHEELS MR'I BAŞLAT</button>
  <div id="loading-text">Model Arka Planda Yükleniyor...</div>

<script>
  var scene, camera, renderer;
  var carMesh; 
  var loadedReverbModel = null; 

  // Sürüş Değişkenleri
  var currentSpeed = 0;
  var MAX_SPEED_FORWARD = -0.012; 
  var MAX_SPEED_BACKWARD = 0.006;  
  var ACCEL = 0.0003;             
  var FRICTION = 0.96;            
  var BRAKE_FORCE = 0.88;         

  var isThrottlePressed = false;
  var isBrakePressed = false;
  var turnValue = 0;

  // Fizik & Tutma
  var activeGrabber = null; 
  var isJustGrabbed = false;

  var velocity = new THREE.Vector3(0, 0, 0); 
  var angularVelocity = new THREE.Vector3(0, 0, 0); 
  
  var lastControllerPos = new THREE.Vector3(0, 0, 0);
  var lastControllerEuler = new THREE.Euler(0, 0, 0);
  
  var GRAVITY = -9.81;
  var FLOOR_Y = 0.008; 
  var GRAB_RADIUS = 0.05; 

  // Kumandalar & 3D Menü
  var leftController = null;
  var rightController = null;
  var isSpawnedAtUser = false;

  var isMenuOpen = false;
  var isLevelingMode = false;
  var menuButtonPressedLastFrame = false;

  // 3D Menü Nesneleri
  var menuGroup;
  var canvasMenu, ctxMenu, textureMenu;
  var canvasLeveling, ctxLeveling, textureLeveling;
  var menuMesh, levelingMesh;

  // Lazer & Raycaster (Menü Tıklamaları İçin)
  var raycaster = new THREE.Raycaster();
  var controllerLine;
  var rightTriggerPressedLastFrame = false;

  var startBtn = document.getElementById('start-btn');
  var loadingText = document.getElementById('loading-text');

  // --- MODEL ÖNDEN YÜKLEME ---
  var loader = new THREE.GLTFLoader();

  loader.load('./car_model.glb', function(gltf) {
    loadedReverbModel = gltf.scene;
    loadedReverbModel.rotation.y = Math.PI / 2;

    var bboxInitial = new THREE.Box3().setFromObject(loadedReverbModel);
    var currentLength = bboxInitial.max.z - bboxInitial.min.z;
    if ((bboxInitial.max.x - bboxInitial.min.x) > currentLength) {
      currentLength = bboxInitial.max.x - bboxInitial.min.x;
    }

    var targetLength = 0.07; 
    var targetScale = targetLength / currentLength;
    loadedReverbModel.scale.set(targetScale, targetScale, targetScale);

    loadedReverbModel.traverse(function(child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    var bboxFinal = new THREE.Box3().setFromObject(loadedReverbModel);
    loadedReverbModel.position.y = -bboxFinal.min.y - 0.01; 

    loadingText.style.display = 'none';
    startBtn.style.display = 'block';

  }, function(xhr) {
    if (xhr.total > 0) {
      var percent = Math.round((xhr.loaded / xhr.total) * 100);
      loadingText.innerText = 'Model Hazırlanıyor... %' + percent;
    }
  }, function(error) {
    console.error('GLB Yükleme Hatası:', error);
    loadingText.style.color = '#ff3366';
    loadingText.innerText = 'HATA: "car_model.glb" bulunamadı!';
  });

  // WEBXR BAŞLATMA
  startBtn.addEventListener('click', function() {
    if (!navigator.xr) {
      alert('WebXR desteklenmiyor!');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'local-floor', 'bounded-floor']
    }).then(function(session) {
      startBtn.style.display = 'none';
      initThreeJS(session);
    }).catch(function(err) {
      alert('MR Başlatılamadı: ' + err.message);
    });
  });

  // --- 3D CANVAS MENÜ DOKULARI ÇİZİMİ ---
  function create3DMenuTextures() {
    // 1. Ana Menü Canvas
    canvasMenu = document.createElement('canvas');
    canvasMenu.width = 512;
    canvasMenu.height = 512;
    ctxMenu = canvasMenu.getContext('2d');

    ctxMenu.fillStyle = 'rgba(10, 10, 15, 0.9)';
    ctxMenu.fillRect(0, 0, 512, 512);
    ctxMenu.strokeStyle = '#00ffcc';
    ctxMenu.lineWidth = 10;
    ctxMenu.strokeRect(5, 5, 502, 502);

    ctxMenu.fillStyle = '#00ffcc';
    ctxMenu.font = 'bold 42px sans-serif';
    ctxMenu.textAlign = 'center';
    ctxMenu.fillText('AYARLAR', 256, 80);

    // Buton 1: Leveling
    ctxMenu.fillStyle = '#00ffcc';
    ctxMenu.beginPath();
    ctxMenu.roundRect(50, 150, 412, 100, 20);
    ctxMenu.fill();
    ctxMenu.fillStyle = '#000';
    ctxMenu.font = 'bold 32px sans-serif';
    ctxMenu.fillText('MANUEL LEVELING', 256, 212);

    // Buton 2: Kapat
    ctxMenu.fillStyle = '#ff3366';
    ctxMenu.beginPath();
    ctxMenu.roundRect(50, 310, 412, 100, 20);
    ctxMenu.fill();
    ctxMenu.fillStyle = '#fff';
    ctxMenu.fillText('KAPAT', 256, 372);

    textureMenu = new THREE.CanvasTexture(canvasMenu);

    // 2. Leveling Modu Canvas
    canvasLeveling = document.createElement('canvas');
    canvasLeveling.width = 512;
    canvasLeveling.height = 512;
    ctxLeveling = canvasLeveling.getContext('2d');

    ctxLeveling.fillStyle = 'rgba(10, 10, 15, 0.9)';
    ctxLeveling.fillRect(0, 0, 512, 512);
    ctxLeveling.strokeStyle = '#ffcc00';
    ctxLeveling.lineWidth = 10;
    ctxLeveling.strokeRect(5, 5, 502, 502);

    ctxLeveling.fillStyle = '#ffcc00';
    ctxLeveling.font = 'bold 36px sans-serif';
    ctxLeveling.textAlign = 'center';
    ctxLeveling.fillText('LEVELING MODU', 256, 80);

    ctxLeveling.fillStyle = '#ffffff';
    ctxLeveling.font = '24px sans-serif';
    ctxLeveling.fillText('Sol Stick (Yukarı/Aşağı)', 256, 160);
    ctxLeveling.fillText('ile yüksekliği ayarlayın.', 256, 200);

    // Done Butonu
    ctxLeveling.fillStyle = '#00ffcc';
    ctxLeveling.beginPath();
    ctxLeveling.roundRect(50, 300, 412, 120, 20);
    ctxLeveling.fill();
    ctxLeveling.fillStyle = '#000';
    ctxLeveling.font = 'bold 40px sans-serif';
    ctxLeveling.fillText('DONE', 256, 375);

    textureLeveling = new THREE.CanvasTexture(canvasLeveling);
  }

  function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    // Işıklar
    var light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.8);
    scene.add(light);
    var dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    // Hitbox & Model
    var hitboxGeometry = new THREE.BoxGeometry(0.03, 0.02, 0.07);
    var hitboxMaterial = new THREE.MeshBasicMaterial({ visible: false });
    carMesh = new THREE.Mesh(hitboxGeometry, hitboxMaterial);
    carMesh.position.set(0, FLOOR_Y, -0.4);
    scene.add(carMesh);

    if (loadedReverbModel) {
      carMesh.add(loadedReverbModel);
    }

    // Sol ve Sağ Kumandalar
    leftController = renderer.xr.getController(0);
    scene.add(leftController);

    rightController = renderer.xr.getController(1);
    scene.add(rightController);

    // Sağ Kumanda İçin Lazer Çizgisi
    var lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2)]);
    var lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.5 });
    controllerLine = new THREE.Line(lineGeo, lineMat);
    rightController.add(controllerLine);

    // 3D Menü Panellerini Hazırla ve Sol Kumandaya Bağla
    create3DMenuTextures();
    menuGroup = new THREE.Group();

    var planeGeo = new THREE.PlaneGeometry(0.18, 0.18); // 18cm x 18cm boyutunda 3D panel

    var matMenu = new THREE.MeshBasicMaterial({ map: textureMenu, side: THREE.DoubleSide, transparent: true });
    menuMesh = new THREE.Mesh(planeGeo, matMenu);
    menuMesh.name = "menuMesh";

    var matLeveling = new THREE.MeshBasicMaterial({ map: textureLeveling, side: THREE.DoubleSide, transparent: true });
    levelingMesh = new THREE.Mesh(planeGeo, matLeveling);
    levelingMesh.name = "levelingMesh";

    menuGroup.add(menuMesh);
    menuGroup.add(levelingMesh);

    // Menüyü Sol Kumandanın 12cm Üstüne ve 5cm İlerisine Konumlandır
    menuGroup.position.set(0, 0.12, -0.05);
    menuGroup.rotation.x = -Math.PI / 6; // Kullanıcıya doğru hafif yatık durması için
    menuGroup.visible = false;

    leftController.add(menuGroup);

    renderer.setAnimationLoop(render);
  }

  var lastTime = performance.now();

  function render(time, frame) {
    var session = renderer.xr.getSession();
    var delta = (time - lastTime) / 1000;
    if (delta > 0.1) delta = 0.1;
    lastTime = time;

    // Oyuncu Hizalama
    if (!isSpawnedAtUser && camera) {
      var camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
        carMesh.position.set(camPos.x, FLOOR_Y, camPos.z - 0.4);
        isSpawnedAtUser = true;
      }
    }

    var leftTriggerPressed = false;
    var rightTriggerPressed = false;

    if (session && session.inputSources) {
      isThrottlePressed = false;
      isBrakePressed = false;
      turnValue = 0;

      for (var i = 0; i < session.inputSources.length; i++) {
        var source = session.inputSources[i];
        if (!source.gamepad) continue;

        // SAĞ KUMANDA (Gaz / Fren & Lazer Tıklamaları)
        if (source.handedness === 'right') {
          var isRightTrigger = source.gamepad.buttons[0] && source.gamepad.buttons[0].value > 0.1;
          
          if (isRightTrigger) {
            rightTriggerPressed = true;
            if (!activeGrabber && !isMenuOpen && !isLevelingMode) isThrottlePressed = true;
          }
          if (source.gamepad.buttons[1] && source.gamepad.buttons[1].value > 0.1) {
            if (!activeGrabber && !isMenuOpen && !isLevelingMode) isBrakePressed = true;
          }

          // 3D Menü Tıklama Kontrolü (Sağ Tetik Basıldığı An)
          if (isRightTrigger && !rightTriggerPressedLastFrame && menuGroup.visible) {
            handleMenuClick();
          }
          rightTriggerPressedLastFrame = isRightTrigger;
        }

        // SOL KUMANDA (Direksiyon, Üç Çizgi Menü Tuşu & Leveling)
        if (source.handedness === 'left') {
          var axes = source.gamepad.axes;

          // Sol Kumanda 3 Çizgi Tuşu (Button 1)
          var menuBtnPressed = source.gamepad.buttons[1] && source.gamepad.buttons[1].pressed;
          if (menuBtnPressed && !menuButtonPressedLastFrame) {
            if (!isLevelingMode) {
              isMenuOpen = !isMenuOpen;
              menuGroup.visible = isMenuOpen;
              menuMesh.visible = true;
              levelingMesh.visible = false;
            }
          }
          menuButtonPressedLastFrame = menuBtnPressed;

          // Leveling Modunda Y Yüksekliği Ayarlama
          if (isLevelingMode && axes && axes.length > 1) {
            var axisY = axes.length >= 4 ? axes[3] : axes[1];
            if (Math.abs(axisY) > 0.1) {
              FLOOR_Y -= axisY * 0.002; // Canlı Yükseklik Değişimi
              if (!activeGrabber) {
                carMesh.position.y = FLOOR_Y;
              }
            }
          } 
          // Sürüşte Direksiyon
          else if (!isMenuOpen && axes && axes.length > 0) {
            var axisX = axes.length >= 4 ? axes[2] : axes[0];
            if (Math.abs(axisX) > 0.05) {
              turnValue = axisX;
            }
          }

          if (source.gamepad.buttons[0] && source.gamepad.buttons[0].value > 0.1) {
            leftTriggerPressed = true;
          }
        }
      }
    }

    // TUTMA TESPİTİ
    var leftPos = new THREE.Vector3();
    var rightPos = new THREE.Vector3();

    if (leftController) leftController.getWorldPosition(leftPos);
    if (rightController) rightController.getWorldPosition(rightPos);

    var distLeft = leftPos.distanceTo(carMesh.position);
    var distRight = rightPos.distanceTo(carMesh.position);

    var prevGrabber = activeGrabber;

    if (leftTriggerPressed && (distLeft < GRAB_RADIUS || activeGrabber === 'left')) {
      activeGrabber = 'left';
    } else if (rightTriggerPressed && (distRight < GRAB_RADIUS || activeGrabber === 'right')) {
      activeGrabber = 'right';
    } else {
      activeGrabber = null;
    }

    if (activeGrabber && !prevGrabber) {
      isJustGrabbed = true;
    }

    // ELDE TUTULUYORSA
    if (activeGrabber) {
      var activeController = (activeGrabber === 'left') ? leftController : rightController;

      if (activeController) {
        var controllerPos = new THREE.Vector3();
        var controllerQuat = new THREE.Quaternion();

        activeController.getWorldPosition(controllerPos);
        activeController.getWorldQuaternion(controllerQuat);

        if (isJustGrabbed) {
          lastControllerPos.copy(controllerPos);
          lastControllerEuler.setFromQuaternion(controllerQuat, 'XYZ');
          velocity.set(0, 0, 0);
          angularVelocity.set(0, 0, 0);
          currentSpeed = 0;
          isJustGrabbed = false;
        } else if (delta > 0) {
          velocity.subVectors(controllerPos, lastControllerPos).divideScalar(delta);
          lastControllerPos.copy(controllerPos);

          var currentEuler = new THREE.Euler().setFromQuaternion(controllerQuat, 'XYZ');
          angularVelocity.set(
            (currentEuler.x - lastControllerEuler.x) / delta,
            (currentEuler.y - lastControllerEuler.y) / delta,
            (currentEuler.z - lastControllerEuler.z) / delta
          );
          lastControllerEuler.copy(currentEuler);
        }

        carMesh.position.copy(controllerPos);
        carMesh.quaternion.copy(controllerQuat);
      }
    } 
    // SERBEST DÜŞÜŞ VE FİZİK
    else {
      if (carMesh.position.y > FLOOR_Y) {
        velocity.y += GRAVITY * delta;

        carMesh.rotation.x += angularVelocity.x * delta;
        carMesh.rotation.y += angularVelocity.y * delta;
        carMesh.rotation.z += angularVelocity.z * delta;
      }

      carMesh.position.x += velocity.x * delta;
      carMesh.position.y += velocity.y * delta;
      carMesh.position.z += velocity.z * delta;

      if (carMesh.position.y <= FLOOR_Y) {
        carMesh.position.y = FLOOR_Y;
        velocity.y = 0;

        angularVelocity.multiplyScalar(0.05);

        var upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(carMesh.quaternion);
        var rightVector = new THREE.Vector3(1, 0, 0).applyQuaternion(carMesh.quaternion);

        var targetRoll = 0;
        var targetPitch = 0;

        if (Math.abs(rightVector.y) > 0.6) {
          targetRoll = rightVector.y > 0 ? -Math.PI / 2 : Math.PI / 2; 
        } 
        else if (upVector.y < 0) {
          targetRoll = Math.PI; 
        }

        var currentEuler = new THREE.Euler().setFromQuaternion(carMesh.quaternion, 'YXZ');
        currentEuler.x = THREE.MathUtils.lerp(currentEuler.x, targetPitch, 0.2);
        currentEuler.z = THREE.MathUtils.lerp(currentEuler.z, targetRoll, 0.2);

        carMesh.quaternion.setFromEuler(currentEuler);

        velocity.x *= 0.8;
        velocity.z *= 0.8;
      }

      var upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(carMesh.quaternion);
      var isUprightAndOnGround = upVector.y > 0.65;

      if (carMesh.position.y <= FLOOR_Y + 0.005 && isUprightAndOnGround && !isMenuOpen && !isLevelingMode) {
        if (isThrottlePressed) {
          if (currentSpeed > MAX_SPEED_FORWARD) {
            currentSpeed -= ACCEL;
          }
        } 
        else if (isBrakePressed) {
          if (currentSpeed < -0.0005) {
            currentSpeed *= BRAKE_FORCE; 
          } 
          else if (currentSpeed < MAX_SPEED_BACKWARD) {
            currentSpeed += ACCEL * 0.6; 
          }
        } 
        else {
          currentSpeed *= FRICTION;
          if (Math.abs(currentSpeed) < 0.00005) currentSpeed = 0;
        }

        if (currentSpeed !== 0 && Math.abs(turnValue) > 0.05) {
          var directionMultiplier = currentSpeed < 0 ? 1 : -1;
          carMesh.rotateY(-turnValue * 0.05 * directionMultiplier);
        }

        carMesh.translateZ(currentSpeed);
      } else {
        currentSpeed = 0;
      }
    }

    renderer.render(scene, camera);
  }

  // --- 3D MENÜ ARAYÜZ TIKLAMA HESAPLAMASI ---
  function handleMenuClick() {
    if (!rightController) return;

    var tempMatrix = new THREE.Matrix4();
    tempMatrix.identity().extractRotation(rightController.matrixWorld);

    raycaster.ray.origin.setFromMatrixPosition(rightController.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    var intersects = raycaster.intersectObjects(menuGroup.children);

    if (intersects.length > 0) {
      var hit = intersects[0];
      var uv = hit.uv; // Tıklanan noktanın 0-1 arası koordinatı

      // 1. ANA MENÜ
      if (menuMesh.visible && hit.object.name === "menuMesh") {
        // "MANUEL LEVELING" Butonu (Y koordinatı 0.51 - 0.70 arası)
        if (uv.y >= 0.51 && uv.y <= 0.70) {
          isLevelingMode = true;
          isMenuOpen = false;
          menuMesh.visible = false;
          levelingMesh.visible = true;
        } 
        // "KAPAT" Butonu (Y koordinatı 0.20 - 0.39 arası)
        else if (uv.y >= 0.20 && uv.y <= 0.39) {
          isMenuOpen = false;
          menuGroup.visible = false;
        }
      } 
      // 2. LEVELING MODU
      else if (levelingMesh.visible && hit.object.name === "levelingMesh") {
        // "DONE" Butonu (Y koordinatı 0.17 - 0.41 arası)
        if (uv.y >= 0.17 && uv.y <= 0.41) {
          isLevelingMode = false;
          menuGroup.visible = false;
        }
      }
    }
  }
</script>
</body>
</html>
