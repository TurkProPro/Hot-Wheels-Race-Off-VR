<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
  </style>
  <!-- Sadece Tam Uyumlu Three.js ve VRButton -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/VRButton.js"></script>
</head>
<body>

<script>
  let scene, camera, renderer;
  let carMesh;

  let isMovingForward = false;
  let isMovingBackward = false;
  let turnValue = 0;
  let speed = 0;

  init();
  animate();

  function init() {
    // 1. Sahne ve Kamera
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    // 2. WebGL Renderer ve WebXR Etkinleştirme
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 3. VR / AR Butonunu Doğrudan Gömmek
    document.body.appendChild(VRButton.createButton(renderer));

    // Işıklandırma
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // 4. Rip Rod Hitbox (3cm x 2.5cm x 7cm Gri Kutu)
    const carGeometry = new THREE.BoxGeometry(0.03, 0.025, 0.07);
    const carMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    carMesh = new THREE.Mesh(carGeometry, carMaterial);
    
    // Arabayı başlangıçta 1 metre ileriye yerleştir
    carMesh.position.set(0, 0, -1);
    scene.add(carMesh);

    // 5. Kontrolcüler (Sağ ve Sol Kumanda)
    const controller0 = renderer.xr.getController(0);
    const controller1 = renderer.xr.getController(1);
    scene.add(controller0);
    scene.add(controller1);

    // İleri / Geri Tetik Olayları
    const onSelectStart = () => { isMovingForward = true; };
    const onSelectEnd = () => { isMovingForward = false; };
    const onSqueezeStart = () => { isMovingBackward = true; };
    const onSqueezeEnd = () => { isMovingBackward = false; };

    controller0.addEventListener('selectstart', onSelectStart);
    controller0.addEventListener('selectend', onSelectEnd);
    controller0.addEventListener('squeezestart', onSqueezeStart);
    controller0.addEventListener('squeezeend', onSqueezeEnd);

    controller1.addEventListener('selectstart', onSelectStart);
    controller1.addEventListener('selectend', onSelectEnd);
    controller1.addEventListener('squeezestart', onSqueezeStart);
    controller1.addEventListener('squeezeend', onSqueezeEnd);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render() {
    const session = renderer.xr.getSession();
    turnValue = 0;

    if (session && session.inputSources) {
      for (const source of session.inputSources) {
        if (source.gamepad && source.gamepad.axes.length >= 2) {
          // Sol analog kol hassasiyeti
          if (Math.abs(source.gamepad.axes[0]) > 0.1) {
            turnValue = source.gamepad.axes[0];
          }
        }
      }
    }

    // İlerleme Hızı Hesaplama
    if (isMovingForward) {
      speed = -0.01;
    } else if (isMovingBackward) {
      speed = 0.005;
    } else {
      speed = 0;
    }

    // Direksiyon Dönüşü
    if (Math.abs(turnValue) > 0.1) {
      carMesh.rotation.y -= turnValue * 0.05;
    }

    // Arabayı Baktığı Yöne Doğru İlerletme
    carMesh.translateZ(speed);

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
