<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D .GLB Araç Sürüşü</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
        }
    </style>
    <!-- Three.js ve glTF/GLB Yükleyici -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="info">W/A/S/D veya Yön Tuşları ile Arabayı Sürün</div>

    <script>
        // 1. Sahne, Kamera ve Render
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x22222d);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Zemin (Pist)
        const grid = new THREE.GridHelper(100, 50, 0x00ffcc, 0x444444);
        scene.add(grid);

        // 4. .GLB Modeli Yükleme
        let car;
        const loader = new THREE.GLTFLoader();
        
        // Buradaki dosya adının sizin .glb dosyanızla birebir aynı olduğundan emin olun
        loader.load('car_model.glb', (gltf) => {
            car = gltf.scene;
            
            // Eğer model ekranda devasa veya minicik görünürse buradaki ölçeği ayarlayabilirsiniz (örn: 1, 1, 1)
            car.scale.set(0.5, 0.5, 0.5); 
            car.position.set(0, 0, 0);
            
            car.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(car);
            console.log(".GLB Modeli başarıyla yüklendi!");
        }, 
        (xhr) => {
            console.log((xhr.loaded / xhr.total * 100) + '% yüklendi');
        },
        (error) => {
            console.error("GLB Yükleme Hatası:", error);
        });

        // 5. Araç Kontrolleri
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
        let speed = 0;
        const maxSpeed = 0.25;
        const accel = 0.008;
        const friction = 0.97;

        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // 6. Oyun Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            if (car) {
                // İleri / Geri
                if (keys.ArrowUp || keys.w) speed += accel;
                if (keys.ArrowDown || keys.s) speed -= accel;

                // Dönüşler
                if (keys.ArrowLeft || keys.a) car.rotation.y += 0.04 * (speed / maxSpeed);
                if (keys.ArrowRight || keys.d) car.rotation.y -= 0.04 * (speed / maxSpeed);

                // Sürtünme ve Hareket
                speed *= friction;
                car.translateZ(speed);

                // Kamera Takibi
                const relativeCameraOffset = new THREE.Vector3(0, 3, -8);
                const cameraOffset = relativeCameraOffset.applyMatrix4(car.matrixWorld);
                camera.position.lerp(cameraOffset, 0.1);
                camera.lookAt(car.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
