<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR - Physics & Menu Lock Update</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
    #loading-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #00ffcc;
      z-index: 9999;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <button id="start-btn" style="display:none;">HOT WHEELS MR'I BAŞLAT</button>
  <div id="loading-text">Model Arka Planda Yükleniyor...</div>

<script>
  var scene, camera, renderer;
  var carMesh; 
  var loadedReverbModel = null; 

  // Sürüş Değişkenleri
  var currentSpeed = 0;
  var MAX_SPEED_FORWARD = -0.012; 
  var MAX_SPEED_BACKWARD = 0.006;  
  var ACCEL = 0.0003;             
  var FRICTION = 0.96;            
  var BRAKE_FORCE = 0.88;         

  var isThrottlePressed = false;
  var isBrakePressed = false;
  var turnValue = 0;

  // Fizik Değişkenleri
  var activeGrabber = null; 
  var isJustGrabbed = false;
  var wasGroundedLastFrame = true;
  var wasGrabbedLastFrame = false;

  var velocity = new THREE.Vector3(0, 0, 0); 
  var angularVelocity = new THREE.Vector3(0, 0, 0); 
  
  var lastControllerPos = new THREE.Vector3(0, 0, 0);
  var lastControllerEuler = new THREE.Euler(0, 0, 0);
  
  var GRAVITY = -9.81;
  var FLOOR_Y = 0.0; 
  var CAR_HEIGHT_UPRIGHT = 0.012; 
  var CAR_HEIGHT_UPSIDEDOWN = 0.010; 
  
  var BOUNCE_FACTOR = 0.35;       
  var BOUNCE_THRESHOLD = 0.25;    
  var GRAB_RADIUS = 0.12; 

  var downRaycaster = new THREE.Raycaster();
  var sideRaycaster = new THREE.Raycaster();

  // Kumandalar
  var controller0 = null;
  var controller1 = null;
  var leftController = null;
  var rightController = null;
  var isSpawnedAtUser = false;

  // Menü Değişkenleri
  var isMenuOpen = false;
  var selectedMenuIndex = 0; 
  var activeMode = "NONE";   
  
  var menuButtonPressedLastFrame = false;
  var xButtonPressedLastFrame = false;
  var aButtonPressedLastFrame = false;
  var bButtonPressedLastFrame = false;
  var rightTriggerPressedLastFrame = false;
  var stickNavCooldown = false;

  var squareMenuMesh;
  var canvasMenu, ctxMenu, textureMenu;

  // HITBOX OLUŞTURMA & EDİT DEĞİŞKENLERİ
  var customHitboxes = []; 
  var hitboxVisuals = [];  
  var point1 = null;
  var point2 = null;
  var tempPointMarker = null; 

  var selectedHitboxIndex = 0; 
  var selectedColorIndex = 0;  
  var currentOpacity = 0.50;   
  var currentBrightness = 0.30; 
  var rotX = 0, rotY = 0, rotZ = 0;

  var activeSubSelection = 0;  
  var isEditingValue = false; // A tuşu kilit mekanizması

  var rainbowPalette = [
    { name: "Gri (Default)", hex: 0x888888, str: "#888888" },
    { name: "Kirmizi",       hex: 0xff0000, str: "#ff0000" },
    { name: "Turuncu",       hex: 0xff7f00, str: "#ff7f00" },
    { name: "Sari",          hex: 0xffff00, str: "#ffff00" },
    { name: "Yesil",         hex: 0x00ff00, str: "#00ff00" },
    { name: "Siyan",         hex: 0x00ffff, str: "#00ffff" },
    { name: "Mavi",          hex: 0x0000ff, str: "#0000ff" },
    { name: "Mor",           hex: 0x4b0082, str: "#4b0082" },
    { name: "Pembe",         hex: 0x9400d3, str: "#9400d3" }
  ];

  var startBtn = document.getElementById('start-btn');
  var loadingText = document.getElementById('loading-text');

  var loader = new THREE.GLTFLoader();

  loader.load('./car_model.glb', function(gltf) {
    loadedReverbModel = gltf.scene;

    var bboxInitial = new THREE.Box3().setFromObject(loadedReverbModel);
    var center = new THREE.Vector3();
    bboxInitial.getCenter(center);
    loadedReverbModel.position.sub(center); 

    var wrapperGroup = new THREE.Group();
    wrapperGroup.add(loadedReverbModel);
    loadedReverbModel.rotation.y = Math.PI / 2;

    var bboxScaled = new THREE.Box3().setFromObject(wrapperGroup);
    var currentLength = bboxScaled.max.z - bboxScaled.min.z;
    if ((bboxScaled.max.x - bboxScaled.min.x) > currentLength) {
      currentLength = bboxScaled.max.x - bboxScaled.min.x;
    }

    var targetLength = 0.07; 
    var targetScale = targetLength / currentLength;
    wrapperGroup.scale.set(targetScale, targetScale, targetScale);

    wrapperGroup.traverse(function(child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    loadedReverbModel = wrapperGroup;

    loadingText.style.display = 'none';
    startBtn.style.display = 'block';

  }, function(xhr) {
    if (xhr.total > 0) {
      var percent = Math.round((xhr.loaded / xhr.total) * 100);
      loadingText.innerText = 'Model Hazırlanıyor... %' + percent;
    }
  }, function(error) {
    console.error('GLB Yükleme Hatası:', error);
    loadingText.style.color = '#ff3366';
    loadingText.innerText = 'HATA: "car_model.glb" bulunamadı!';
  });

  startBtn.addEventListener('click', function() {
    if (!navigator.xr) {
      alert('WebXR desteklenmiyor!');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'local-floor', 'bounded-floor']
    }).then(function(session) {
      startBtn.style.display = 'none';
      initThreeJS(session);
    }).catch(function(err) {
      alert('MR Başlatılamadı: ' + err.message);
    });
  });

  function updateMenuTexture() {
    ctxMenu.fillStyle = 'rgba(15, 15, 20, 0.95)';
    ctxMenu.fillRect(0, 0, 512, 512);

    ctxMenu.strokeStyle = '#00ffcc';
    ctxMenu.lineWidth = 10;
    ctxMenu.strokeRect(5, 5, 502, 502);

    ctxMenu.fillStyle = '#00ffcc';
    ctxMenu.font = 'bold 32px sans-serif';
    ctxMenu.textAlign = 'center';
    ctxMenu.fillText('AYARLAR MENÜSÜ', 256, 45);

    if (activeMode === "NONE") {
      var items = ["1. Zemin Yüksekliği", "2. Kutu (Hitbox) Ekle", "3. Kutu (Hitbox) Düzenle"];
      for (var i = 0; i < 3; i++) {
        var yPos = 120 + (i * 90);
        if (selectedMenuIndex === i) {
          ctxMenu.fillStyle = '#00ffcc';
          ctxMenu.fillRect(30, yPos, 452, 70);
          ctxMenu.fillStyle = '#000000';
          ctxMenu.font = 'bold 28px sans-serif';
          ctxMenu.fillText('> ' + items[i] + ' <', 256, yPos + 45);
        } else {
          ctxMenu.fillStyle = '#ffffff';
          ctxMenu.font = '26px sans-serif';
          ctxMenu.fillText(items[i], 256, yPos + 45);
        }
      }
      ctxMenu.fillStyle = '#aaaaaa';
      ctxMenu.font = '20px sans-serif';
      ctxMenu.fillText('Gezin: Sol Stick | Seç: [ X ]', 256, 450);

    } else if (activeMode === "LEVELING") {
      ctxMenu.fillStyle = '#ffcc00';
      ctxMenu.font = 'bold 30px sans-serif';
      ctxMenu.fillText('ZEMİN YÜKSEKLİĞİ AYARI', 256, 140);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '24px sans-serif';
      ctxMenu.fillText('Sol Stick İle Yüksekliği Ayarla', 256, 220);
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.fillText('Kaydet ve Çık: [ X ]', 256, 330);

    } else if (activeMode === "HITBOX_P1") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 28px sans-serif';
      ctxMenu.fillText('HITBOX: 1. NOKTA', 256, 110);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '22px sans-serif';
      ctxMenu.fillText('1. Sağ Trigger ile Nokta Koy', 256, 180);
      ctxMenu.fillText('2. Sol Stick: X/Z Kaydır', 256, 220);
      ctxMenu.fillText('3. Sağ Stick: Yüksekliği Ayarla', 256, 260);
      ctxMenu.fillStyle = '#ffcc00';
      ctxMenu.fillText('Onayla ve Devam Et: [ A ]', 256, 340);

    } else if (activeMode === "HITBOX_P2") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 28px sans-serif';
      ctxMenu.fillText('HITBOX: 2. NOKTA', 256, 110);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '22px sans-serif';
      ctxMenu.fillText('1. Çapraz İkinci Noktayı Koy', 256, 180);
      ctxMenu.fillText('2. Sol Stick: X/Z Kaydır', 256, 220);
      ctxMenu.fillText('3. Sağ Stick: Yüksekliği Ayarla', 256, 260);
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.fillText('Kutuyu Oluştur: [ A ]', 256, 340);

    } else if (activeMode === "HITBOX_LIST") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 28px sans-serif';
      ctxMenu.fillText('MEVCUT HITBOX\'LAR', 256, 95);

      if (customHitboxes.length === 0) {
        ctxMenu.fillStyle = '#ff3366';
        ctxMenu.font = '24px sans-serif';
        ctxMenu.fillText('Sahnede Hitbox Bulunamadı!', 256, 220);
      } else {
        var startIdx = Math.max(0, selectedHitboxIndex - 1);
        var endIdx = Math.min(customHitboxes.length, startIdx + 3);

        for (var i = startIdx; i < endIdx; i++) {
          var yPos = 135 + ((i - startIdx) * 70);
          if (i === selectedHitboxIndex) {
            ctxMenu.fillStyle = '#00ffcc';
            ctxMenu.fillRect(50, yPos, 412, 55);
            ctxMenu.fillStyle = '#000000';
            ctxMenu.font = 'bold 24px sans-serif';
            ctxMenu.fillText('> HITBOX ' + (i + 1) + ' <', 256, yPos + 37);
          } else {
            ctxMenu.fillStyle = '#ffffff';
            ctxMenu.font = '22px sans-serif';
            ctxMenu.fillText('Hitbox ' + (i + 1), 256, yPos + 37);
          }
        }
      }

      ctxMenu.fillStyle = '#aaaaaa';
      ctxMenu.font = '19px sans-serif';
      ctxMenu.fillText('[ A ] Düzenle / Eğim Ver  |  [ B ] Sil', 256, 415);
      ctxMenu.fillText('Çıkış: [ X ]', 256, 450);

    } else if (activeMode === "CONFIRM_DELETE") {
      ctxMenu.fillStyle = '#ff3366';
      ctxMenu.font = 'bold 30px sans-serif';
      ctxMenu.fillText('EMİN MİSİNİZ?', 256, 140);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '24px sans-serif';
      ctxMenu.fillText('Hitbox ' + (selectedHitboxIndex + 1) + ' silinecek!', 256, 210);

      ctxMenu.fillStyle = '#33ff66';
      ctxMenu.fillText('[ A ] Evet, Sil', 256, 300);
      ctxMenu.fillStyle = '#ff3366';
      ctxMenu.fillText('[ B ] Hayır, İptal', 256, 350);

    } else if (activeMode === "HITBOX_COLOR_EDIT") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 22px sans-serif';
      ctxMenu.fillText('HITBOX ' + (selectedHitboxIndex + 1) + ' ÖZELLİK & EĞİM AYARI', 256, 65);

      var startX = 166;
      var startY = 80;
      var boxSize = 48;
      var gap = 10;

      for (var r = 0; r < 9; r++) {
        var col = r % 3;
        var row = Math.floor(r / 3);
        var bx = startX + col * (boxSize + gap);
        var by = startY + row * (boxSize + gap);

        ctxMenu.fillStyle = rainbowPalette[r].str;
        ctxMenu.fillRect(bx, by, boxSize, boxSize);

        if (r === selectedColorIndex && activeSubSelection === 0) {
          ctxMenu.strokeStyle = isEditingValue ? '#ffcc00' : '#ffffff';
          ctxMenu.lineWidth = 4;
          ctxMenu.strokeRect(bx - 2, by - 2, boxSize + 4, boxSize + 4);
        } else {
          ctxMenu.strokeStyle = '#000000';
          ctxMenu.lineWidth = 1;
          ctxMenu.strokeRect(bx, by, boxSize, boxSize);
        }
      }

      drawSlider(260, "Şeffaflık: %" + Math.round(currentOpacity * 100), (currentOpacity - 0.1) / 0.9, activeSubSelection === 1);
      drawSlider(315, "Parlaklık: %" + Math.round(currentBrightness * 100), currentBrightness, activeSubSelection === 2);

      drawOptionRow(370, "Eğim X (Pitch): " + Math.round(rotX) + "°", activeSubSelection === 3);
      drawOptionRow(405, "Eğim Y (Yaw): " + Math.round(rotY) + "°", activeSubSelection === 4);
      drawOptionRow(440, "Eğim Z (Roll): " + Math.round(rotZ) + "°", activeSubSelection === 5);

      ctxMenu.fillStyle = isEditingValue ? '#ffcc00' : '#00ffcc';
      ctxMenu.font = '15px sans-serif';
      ctxMenu.fillText(isEditingValue ? 'DÜZENLEME AÇIK! (Kilitlemek İçin [ A ])' : '[ A ] ile Ayarı Kilitle/Aç | [ X ] Kaydet', 256, 485);
    }

    textureMenu.needsUpdate = true;
  }

  function drawSlider(y, label, percent, isSelected) {
    ctxMenu.fillStyle = '#ffffff';
    ctxMenu.font = '15px sans-serif';
    ctxMenu.fillText(label, 256, y - 5);

    ctxMenu.fillStyle = '#333333';
    ctxMenu.fillRect(90, y, 332, 14);

    ctxMenu.fillStyle = isSelected ? (isEditingValue ? '#ffcc00' : '#00ffcc') : '#00ffcc';
    ctxMenu.fillRect(90, y, percent * 332, 14);

    if (isSelected) {
      ctxMenu.strokeStyle = isEditingValue ? '#ffcc00' : '#ffffff';
      ctxMenu.lineWidth = 2;
      ctxMenu.strokeRect(87, y - 2, 338, 18);
    }
  }

  function drawOptionRow(y, label, isSelected) {
    if (isSelected) {
      ctxMenu.fillStyle = isEditingValue ? '#ffcc00' : '#00ffcc';
      ctxMenu.fillRect(100, y - 18, 312, 24);
      ctxMenu.fillStyle = '#000000';
      ctxMenu.font = 'bold 15px sans-serif';
      ctxMenu.fillText(isEditingValue ? '[ DÜZENLENİYOR ] ' + label : '> ' + label + ' <', 256, y);
    } else {
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '15px sans-serif';
      ctxMenu.fillText(label, 256, y);
    }
  }

  function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    var light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.8);
    scene.add(light);
    var dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    var hitboxGeometry = new THREE.BoxGeometry(0.04, 0.02, 0.07);
    var hitboxMaterial = new THREE.MeshBasicMaterial({ visible: false });
    carMesh = new THREE.Mesh(hitboxGeometry, hitboxMaterial);
    carMesh.position.set(0, FLOOR_Y + CAR_HEIGHT_UPRIGHT, -0.4);
    scene.add(carMesh);

    if (loadedReverbModel) {
      carMesh.add(loadedReverbModel);
    }

    var pointGeo = new THREE.SphereGeometry(0.015, 16, 16);
    var pointMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
    tempPointMarker = new THREE.Mesh(pointGeo, pointMat);
    tempPointMarker.visible = false;
    scene.add(tempPointMarker);

    controller0 = renderer.xr.getController(0);
    scene.add(controller0);

    controller1 = renderer.xr.getController(1);
    scene.add(controller1);

    canvasMenu = document.createElement('canvas');
    canvasMenu.width = 512;
    canvasMenu.height = 512;
    ctxMenu = canvasMenu.getContext('2d');
    textureMenu = new THREE.CanvasTexture(canvasMenu);

    updateMenuTexture();

    var planeGeo = new THREE.PlaneGeometry(0.16, 0.16); 
    var planeMat = new THREE.MeshBasicMaterial({ map: textureMenu, side: THREE.DoubleSide, transparent: true });
    squareMenuMesh = new THREE.Mesh(planeGeo, planeMat);

    squareMenuMesh.position.set(0, 0.12, -0.05);
    squareMenuMesh.rotation.x = -Math.PI / 6; 
    squareMenuMesh.visible = false;

    renderer.setAnimationLoop(render);
  }

  function createHitboxBox(p1, p2) {
    var minX = Math.min(p1.x, p2.x);
    var maxX = Math.max(p1.x, p2.x);
    var minY = Math.min(p1.y, p2.y);
    var maxY = Math.max(p1.y, p2.y);
    var minZ = Math.min(p1.z, p2.z);
    var maxZ = Math.max(p1.z, p2.z);

    if (maxX - minX < 0.02) maxX = minX + 0.02;
    if (maxY - minY < 0.02) maxY = minY + 0.02;
    if (maxZ - minZ < 0.02) maxZ = minZ + 0.02;

    var width = maxX - minX;
    var height = maxY - minY;
    var depth = maxZ - minZ;

    var boxGeo = new THREE.BoxGeometry(width, height, depth);
    var hexCol = rainbowPalette[0].hex;
    
    var boxMat = new THREE.MeshStandardMaterial({
      color: hexCol,
      emissive: hexCol,
      emissiveIntensity: currentBrightness,
      transparent: true,
      opacity: currentOpacity,
      roughness: 0.2
    });

    var boxMesh = new THREE.Mesh(boxGeo, boxMat);
    boxMesh.position.set(minX + width/2, minY + height/2, minZ + depth/2);
    
    var edges = new THREE.EdgesGeometry(boxGeo);
    var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: hexCol }));
    boxMesh.add(line);

    scene.add(boxMesh);
    hitboxVisuals.push(boxMesh);

    customHitboxes.push({
      mesh: boxMesh,
      rotX: 0,
      rotY: 0,
      rotZ: 0
    });
  }

  function removeHitbox(index) {
    if (index >= 0 && index < customHitboxes.length) {
      scene.remove(hitboxVisuals[index]);
      hitboxVisuals.splice(index, 1);
      customHitboxes.splice(index, 1);
      if (selectedHitboxIndex >= customHitboxes.length) {
        selectedHitboxIndex = Math.max(0, customHitboxes.length - 1);
      }
    }
  }

  function updateHitboxAppearance(index, colorHex, opacity, brightness, rx, ry, rz) {
    if (index >= 0 && index < hitboxVisuals.length) {
      var boxMesh = hitboxVisuals[index];
      boxMesh.material.color.setHex(colorHex);
      boxMesh.material.emissive.setHex(colorHex);
      boxMesh.material.emissiveIntensity = brightness;
      boxMesh.material.opacity = opacity;
      
      boxMesh.rotation.set(
        THREE.MathUtils.degToRad(rx),
        THREE.MathUtils.degToRad(ry),
        THREE.MathUtils.degToRad(rz)
      );

      if (boxMesh.children.length > 0) {
        boxMesh.children[0].material.color.setHex(colorHex);
      }

      customHitboxes[index].rotX = rx;
      customHitboxes[index].rotY = ry;
      customHitboxes[index].rotZ = rz;
    }
  }

  function restoreAllHitboxesOpacity() {
    for (var h = 0; h < hitboxVisuals.length; h++) {
      hitboxVisuals[h].material.opacity = currentOpacity;
    }
  }

  function teleportCarToUser() {
    if (!camera || !carMesh) return;

    var camPos = new THREE.Vector3();
    var camQuat = new THREE.Quaternion();
    camera.getWorldPosition(camPos);
    camera.getWorldQuaternion(camQuat);

    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
    forward.y = 0;
    forward.normalize();

    carMesh.position.copy(camPos).add(forward.clone().multiplyScalar(0.5));
    carMesh.position.y = FLOOR_Y + CAR_HEIGHT_UPRIGHT;

    var angle = Math.atan2(forward.x, forward.z);
    carMesh.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle + Math.PI);

    velocity.set(0, 0, 0);
    angularVelocity.set(0, 0, 0);
    currentSpeed = 0;
    activeGrabber = null;
  }

  function smoothAlignToFloor(isUpsideDown, factor) {
    var currentEuler = new THREE.Euler().setFromQuaternion(carMesh.quaternion, 'YXZ');
    var targetEuler = new THREE.Euler(0, currentEuler.y, isUpsideDown ? Math.PI : 0, 'YXZ');
    var targetQuat = new THREE.Quaternion().setFromEuler(targetEuler);

    carMesh.quaternion.slerp(targetQuat, factor);
  }

  var lastTime = performance.now();

  function render(time, frame) {
    var session = renderer.xr.getSession();
    var delta = (time - lastTime) / 1000;
    if (delta > 0.1) delta = 0.1;
    lastTime = time;

    if (!isSpawnedAtUser && camera) {
      var camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
        teleportCarToUser();
        isSpawnedAtUser = true;
      }
    }

    if (isMenuOpen && activeMode === "HITBOX_LIST" && customHitboxes.length > 0) {
      for (var h = 0; h < hitboxVisuals.length; h++) {
        if (h === selectedHitboxIndex) {
          hitboxVisuals[h].material.opacity = 0.3 + Math.sin(time * 0.01) * 0.25;
        } else {
          hitboxVisuals[h].material.opacity = currentOpacity;
        }
      }
    }

    var leftTriggerPressed = false;
    var rightTriggerPressed = false;

    if (session && session.inputSources) {
      isThrottlePressed = false;
      isBrakePressed = false;
      turnValue = 0;

      for (var i = 0; i < session.inputSources.length; i++) {
        var source = session.inputSources[i];
        if (!source.gamepad) continue;

        var targetController = (i === 0) ? controller0 : controller1;
        if (source.handedness === 'left') {
          leftController = targetController;
          if (squareMenuMesh.parent !== leftController) {
            leftController.add(squareMenuMesh);
          }
        } else if (source.handedness === 'right') {
          rightController = targetController;
        }

        var btns = source.gamepad.buttons;
        var axes = source.gamepad.axes;

        // --- SAĞ KUMANDA ---
        if (source.handedness === 'right') {
          var rTriggerValue = btns[0] ? btns[0].value : 0;
          if (rTriggerValue > 0.1) {
            rightTriggerPressed = true;
            if (!activeGrabber && !isMenuOpen) {
              isThrottlePressed = true;
            }
          }
          if (btns[1] && btns[1].value > 0.1) {
            if (!activeGrabber && !isMenuOpen) {
              isBrakePressed = true;
            }
          }

          var aBtnPressed = (btns[4] && btns[4].pressed);
          if (aBtnPressed && !aButtonPressedLastFrame) {
            if (activeMode === "HITBOX_P1" && point1) {
              activeMode = "HITBOX_P2";
              updateMenuTexture();
            } else if (activeMode === "HITBOX_P2" && point2) {
              createHitboxBox(point1, point2);
              point1 = null;
              point2 = null;
              tempPointMarker.visible = false;
              activeMode = "NONE";
              updateMenuTexture();
            } else if (activeMode === "HITBOX_LIST" && customHitboxes.length > 0) {
              var hb = customHitboxes[selectedHitboxIndex];
              rotX = hb.rotX;
              rotY = hb.rotY;
              rotZ = hb.rotZ;
              activeMode = "HITBOX_COLOR_EDIT";
              isEditingValue = false;
              updateMenuTexture();
            } else if (activeMode === "HITBOX_COLOR_EDIT") {
              // A Tuşuna Basarak Düzenlemeyi Aç / Kapat Kilit
              isEditingValue = !isEditingValue;
              updateMenuTexture();
            } else if (activeMode === "CONFIRM_DELETE") {
              removeHitbox(selectedHitboxIndex);
              activeMode = "HITBOX_LIST";
              restoreAllHitboxesOpacity();
              updateMenuTexture();
            } else if (activeMode === "NONE" && !isMenuOpen) {
              teleportCarToUser(); 
            }
          }
          aButtonPressedLastFrame = aBtnPressed;

          var bBtnPressed = (btns[5] && btns[5].pressed);
          if (bBtnPressed && !bButtonPressedLastFrame) {
            if (activeMode === "HITBOX_LIST" && customHitboxes.length > 0) {
              activeMode = "CONFIRM_DELETE";
              updateMenuTexture();
            } else if (activeMode === "CONFIRM_DELETE") {
              activeMode = "HITBOX_LIST";
              updateMenuTexture();
            }
          }
          bButtonPressedLastFrame = bBtnPressed;

          if (rightTriggerPressed && !rightTriggerPressedLastFrame && rightController) {
            var rightPos = new THREE.Vector3();
            rightController.getWorldPosition(rightPos);

            if (activeMode === "HITBOX_P1") {
              point1 = rightPos.clone();
              tempPointMarker.position.copy(point1);
              tempPointMarker.visible = true;
            } else if (activeMode === "HITBOX_P2") {
              point2 = rightPos.clone();
              tempPointMarker.position.copy(point2);
              tempPointMarker.visible = true;
            }
          }
          rightTriggerPressedLastFrame = rightTriggerPressed;

          if ((activeMode === "HITBOX_P1" || activeMode === "HITBOX_P2") && axes && axes.length > 0) {
            var rAxisY = axes.length >= 4 ? axes[3] : axes[1];
            var currentPoint = (activeMode === "HITBOX_P1") ? point1 : point2;
            if (currentPoint && Math.abs(rAxisY) > 0.1) {
              currentPoint.y -= rAxisY * 0.003;
              tempPointMarker.position.copy(currentPoint);
            }
          }
        }

        // --- SOL KUMANDA ---
        if (source.handedness === 'left') {
          var yBtnPressed = (btns[5] && btns[5].pressed);
          if (yBtnPressed && !menuButtonPressedLastFrame) {
            isMenuOpen = !isMenuOpen;
            if (!isMenuOpen) {
              activeMode = "NONE";
              tempPointMarker.visible = false;
              restoreAllHitboxesOpacity();
            }
            squareMenuMesh.visible = isMenuOpen;
            updateMenuTexture();
          }
          menuButtonPressedLastFrame = yBtnPressed;

          var xBtnPressed = (btns[4] && btns[4].pressed);
          if (xBtnPressed && !xButtonPressedLastFrame && isMenuOpen) {
            if (activeMode === "NONE") {
              if (selectedMenuIndex === 0) activeMode = "LEVELING";
              else if (selectedMenuIndex === 1) activeMode = "HITBOX_P1";
              else if (selectedMenuIndex === 2) activeMode = "HITBOX_LIST";
            } else if (activeMode === "LEVELING" || activeMode === "HITBOX_LIST") {
              activeMode = "NONE";
              restoreAllHitboxesOpacity();
            } else if (activeMode === "HITBOX_COLOR_EDIT") {
              updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
              activeMode = "HITBOX_LIST";
              restoreAllHitboxesOpacity();
            }
            updateMenuTexture();
          }
          xButtonPressedLastFrame = xBtnPressed;

          if (axes && axes.length > 0) {
            var axisX = axes.length >= 4 ? axes[2] : axes[0];
            var axisY = axes.length >= 4 ? axes[3] : axes[1];

            if (isMenuOpen && activeMode === "NONE") {
              if (Math.abs(axisY) > 0.5 && !stickNavCooldown) {
                if (axisY > 0.5) selectedMenuIndex = (selectedMenuIndex + 1) % 3;
                if (axisY < -0.5) selectedMenuIndex = (selectedMenuIndex - 1 + 3) % 3;
                stickNavCooldown = true;
                updateMenuTexture();
              } else if (Math.abs(axisY) < 0.2) {
                stickNavCooldown = false;
              }
            } 
            else if (isMenuOpen && activeMode === "HITBOX_LIST") {
              if (Math.abs(axisY) > 0.5 && !stickNavCooldown && customHitboxes.length > 0) {
                if (axisY > 0.5) selectedHitboxIndex = (selectedHitboxIndex + 1) % customHitboxes.length;
                if (axisY < -0.5) selectedHitboxIndex = (selectedHitboxIndex - 1 + customHitboxes.length) % customHitboxes.length;
                stickNavCooldown = true;
                updateMenuTexture();
              } else if (Math.abs(axisY) < 0.2) {
                stickNavCooldown = false;
              }
            }
            else if (isMenuOpen && activeMode === "HITBOX_COLOR_EDIT") {
              // Alt/Üst Seçenek Değiştirme (Eğer bir değer kilitli değilse)
              if (!isEditingValue) {
                if (Math.abs(axisY) > 0.6 && !stickNavCooldown) {
                  if (axisY > 0.6) activeSubSelection = Math.min(5, activeSubSelection + 1);
                  if (axisY < -0.6) activeSubSelection = Math.max(0, activeSubSelection - 1);
                  stickNavCooldown = true;
                  updateMenuTexture();
                } else if (Math.abs(axisY) < 0.2 && Math.abs(axisX) < 0.2) {
                  stickNavCooldown = false;
                }
              } else {
                // A Tuşu İle Açılan Kilitli Düzenleme Modu
                if (activeSubSelection === 0 && Math.abs(axisX) > 0.5 && !stickNavCooldown) {
                  if (axisX > 0.5) selectedColorIndex = (selectedColorIndex + 1) % 9;
                  if (axisX < -0.5) selectedColorIndex = (selectedColorIndex - 1 + 9) % 9;
                  stickNavCooldown = true;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                  updateMenuTexture();
                }

                if (activeSubSelection === 1 && Math.abs(axisX) > 0.1) {
                  currentOpacity += axisX * 0.01;
                  if (currentOpacity < 0.1) currentOpacity = 0.1;
                  if (currentOpacity > 1.0) currentOpacity = 1.0;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                  updateMenuTexture();
                }

                if (activeSubSelection === 2 && Math.abs(axisX) > 0.1) {
                  currentBrightness += axisX * 0.01;
                  if (currentBrightness < 0.0) currentBrightness = 0.0;
                  if (currentBrightness > 1.0) currentBrightness = 1.0;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                  updateMenuTexture();
                }

                // Eğim X - Hassasiyet yavaşlatıldı ve tam sayı yapıldı
                if (activeSubSelection === 3 && Math.abs(axisX) > 0.3 && !stickNavCooldown) {
                  rotX += axisX > 0 ? 1 : -1;
                  if (rotX < -180) rotX += 360;
                  if (rotX > 180) rotX -= 360;
                  stickNavCooldown = true;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                }

                // Eğim Y
                if (activeSubSelection === 4 && Math.abs(axisX) > 0.3 && !stickNavCooldown) {
                  rotY += axisX > 0 ? 1 : -1;
                  if (rotY < -180) rotY += 360;
                  if (rotY > 180) rotY -= 360;
                  stickNavCooldown = true;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                }

                // Eğim Z
                if (activeSubSelection === 5 && Math.abs(axisX) > 0.3 && !stickNavCooldown) {
                  rotZ += axisX > 0 ? 1 : -1;
                  if (rotZ < -180) rotZ += 360;
                  if (rotZ > 180) rotZ -= 360;
                  stickNavCooldown = true;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                }

                if (Math.abs(axisX) < 0.2) {
                  stickNavCooldown = false;
                }
              }
            }
            else if (isMenuOpen && activeMode === "LEVELING") {
              if (Math.abs(axisY) > 0.1) FLOOR_Y -= axisY * 0.002; 
            } 
            else if (isMenuOpen && (activeMode === "HITBOX_P1" || activeMode === "HITBOX_P2")) {
              var targetPoint = (activeMode === "HITBOX_P1") ? point1 : point2;
              if (targetPoint) {
                if (Math.abs(axisX) > 0.1) targetPoint.x += axisX * 0.003;
                if (Math.abs(axisY) > 0.1) targetPoint.z += axisY * 0.003; 
                tempPointMarker.position.copy(targetPoint);
              }
            } 
            else if (!isMenuOpen) {
              if (Math.abs(axisX) > 0.05) {
                turnValue = axisX;
              }
            }
          }

          if (btns[0] && btns[0].value > 0.1) {
            leftTriggerPressed = true;
          }
        }
      }
    }

    // --- GRAB / ELLE TUTMA DÖNGÜSÜ ---
    var leftPos = new THREE.Vector3();
    var rightPos = new THREE.Vector3();

    if (leftController) leftController.getWorldPosition(leftPos);
    if (rightController) rightController.getWorldPosition(rightPos);

    var distLeft = leftController ? leftPos.distanceTo(carMesh.position) : 999;
    var distRight = rightController ? rightPos.distanceTo(carMesh.position) : 999;

    var prevGrabber = activeGrabber;

    if (activeGrabber) {
      if (activeGrabber === 'left' && !leftTriggerPressed) activeGrabber = null;
      if (activeGrabber === 'right' && !rightTriggerPressed) activeGrabber = null;
    } 
    else {
      var leftEligible = leftTriggerPressed && (distLeft < GRAB_RADIUS);
      var rightEligible = rightTriggerPressed && (distRight < GRAB_RADIUS);

      if (leftEligible && rightEligible) {
        activeGrabber = (distLeft <= distRight) ? 'left' : 'right';
      } else if (leftEligible) {
        activeGrabber = 'left';
      } else if (rightEligible) {
        activeGrabber = 'right';
      }
    }

    if (activeGrabber && !prevGrabber) {
      isJustGrabbed = true;
    }

    if (activeGrabber) {
      wasGrabbedLastFrame = true;
      var activeController = (activeGrabber === 'left') ? leftController : rightController;

      if (activeController) {
        var controllerPos = new THREE.Vector3();
        var controllerQuat = new THREE.Quaternion();

        activeController.getWorldPosition(controllerPos);
        activeController.getWorldQuaternion(controllerQuat);

        if (isJustGrabbed) {
          lastControllerPos.copy(controllerPos);
          lastControllerEuler.setFromQuaternion(controllerQuat, 'XYZ');
          velocity.set(0, 0, 0);
          angularVelocity.set(0, 0, 0);
          currentSpeed = 0;
          isJustGrabbed = false;
        } else if (delta > 0) {
          velocity.subVectors(controllerPos, lastControllerPos).divideScalar(delta);
          lastControllerPos.copy(controllerPos);

          var currentEuler = new THREE.Euler().setFromQuaternion(controllerQuat, 'XYZ');
          angularVelocity.set(
            (currentEuler.x - lastControllerEuler.x) / delta,
            (currentEuler.y - lastControllerEuler.y) / delta,
            (currentEuler.z - lastControllerEuler.z) / delta
          );
          lastControllerEuler.copy(currentEuler);
        }

        carMesh.position.copy(controllerPos);
        carMesh.quaternion.copy(controllerQuat);
      }
    } 
    else {
      if (wasGrabbedLastFrame) {
        wasGrabbedLastFrame = false;
        wasGroundedLastFrame = false;
      }

      var upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(carMesh.quaternion);
      var isUpright = upVector.y > 0;
      var carHeightOffset = isUpright ? CAR_HEIGHT_UPRIGHT : CAR_HEIGHT_UPSIDEDOWN;

      var effectiveFloorY = FLOOR_Y;

      // 1. DİKEY HITBOX TESPİTİ (Rampa / Yüzey)
      if (hitboxVisuals.length > 0) {
        var rayOrigin = carMesh.position.clone();
        rayOrigin.y += 0.05; 
        downRaycaster.set(rayOrigin, new THREE.Vector3(0, -1, 0));

        var intersects = downRaycaster.intersectObjects(hitboxVisuals, false);
        if (intersects.length > 0) {
          var topHit = intersects[0];
          if (topHit.distance <= 0.15 && topHit.point.y > effectiveFloorY) {
            effectiveFloorY = topHit.point.y;
          }
        }

        // 2. YATAY HITBOX ÇARPIŞMA TESPİTİ (Yan Taraf Duvar Engeli)
        var horizMoveDir = new THREE.Vector3(velocity.x, 0, velocity.z);
        if (horizMoveDir.lengthSq() > 0.00001) {
          horizMoveDir.normalize();
          sideRaycaster.set(carMesh.position, horizMoveDir);
          var sideIntersects = sideRaycaster.intersectObjects(hitboxVisuals, false);
          if (sideIntersects.length > 0 && sideIntersects[0].distance < 0.04) {
            // Hitbox'ın içine girmesin, hızını yatayda kes
            velocity.x = 0;
            velocity.z = 0;
          }
        }
      }

      var currentMinY = effectiveFloorY + carHeightOffset;
      var isGroundedNow = (carMesh.position.y <= currentMinY + 0.002);

      // PLATFORMDAN DÜŞÜŞ - ÇOK YÖNLÜ (ÖN/ARKA/SAĞ/SOL) DEVRİLME
      if (wasGroundedLastFrame && !isGroundedNow && carMesh.position.y > FLOOR_Y + CAR_HEIGHT_UPRIGHT) {
        var forwardVec = new THREE.Vector3(0, 0, currentSpeed).applyQuaternion(carMesh.quaternion);
        velocity.x = forwardVec.x / delta;
        velocity.z = forwardVec.z / delta;

        // Pitch ve Roll eğimlerini hız ve dönüş açısına göre ekle
        var pitchTorque = (currentSpeed < 0 ? -1 : 1) * 3.5; 
        var rollTorque = turnValue * 4.0; 
        
        angularVelocity.x = pitchTorque;
        angularVelocity.z = rollTorque;
        currentSpeed = 0; 
      }

      wasGroundedLastFrame = isGroundedNow;

      // HAVADA SÜZÜLME / FIRLATILMA
      if (carMesh.position.y > currentMinY || velocity.y > 0) {
        velocity.y += GRAVITY * delta;

        carMesh.rotateX(angularVelocity.x * delta);
        carMesh.rotateY(angularVelocity.y * delta);
        carMesh.rotateZ(angularVelocity.z * delta);

        carMesh.position.x += velocity.x * delta;
        carMesh.position.y += velocity.y * delta;
        carMesh.position.z += velocity.z * delta;
      }

      // ZEMİNE VEYA HITBOX'A İNİŞ / SÜRTÜNEREK DURMA
      if (carMesh.position.y <= currentMinY) {
        carMesh.position.y = currentMinY;

        var carEuler = new THREE.Euler().setFromQuaternion(carMesh.quaternion, 'YXZ');

        // Yüksek dikey hızda hafif sekme
        if (Math.abs(velocity.y) > BOUNCE_THRESHOLD) {
          velocity.y = -velocity.y * BOUNCE_FACTOR;
          velocity.x *= 0.85;
          velocity.z *= 0.85;
          smoothAlignToFloor(!isUpright, 0.2);
        } 
        else {
          velocity.y = 0;

          // FIRLATILAN VEYA DÜŞEN HIZIN SÜRTÜNEREK KORUNMASI
          if (velocity.lengthSq() > 0.00001) {
            carMesh.position.x += velocity.x * delta;
            carMesh.position.z += velocity.z * delta;

            // Zemin sürtünmesi ile kademeli yavaşlama
            velocity.x *= 0.95;
            velocity.z *= 0.95;
            angularVelocity.multiplyScalar(0.2);

            if (velocity.length() < 0.01) {
              velocity.set(0, 0, 0);
            }
          }

          smoothAlignToFloor(!isUpright, 0.25);

          // NORMAL SÜRÜŞ KONTROLÜ
          if (isUpright && !isMenuOpen) {
            if (isThrottlePressed) {
              if (currentSpeed > MAX_SPEED_FORWARD) {
                currentSpeed -= ACCEL;
              }
            } 
            else if (isBrakePressed) {
              if (currentSpeed < -0.0005) {
                currentSpeed *= BRAKE_FORCE; 
              } 
              else if (currentSpeed < MAX_SPEED_BACKWARD) {
                currentSpeed += ACCEL * 0.6; 
              }
            } 
            else {
              currentSpeed *= FRICTION;
              if (Math.abs(currentSpeed) < 0.00005) currentSpeed = 0;
            }

            if (currentSpeed !== 0 && Math.abs(turnValue) > 0.02) {
              var speedRatio = Math.abs(currentSpeed) / Math.abs(MAX_SPEED_FORWARD);
              var effectiveTurn = turnValue * Math.pow(speedRatio, 0.5); 
              var directionMultiplier = currentSpeed < 0 ? 1 : -1;
              
              carMesh.rotateY(-effectiveTurn * 0.045 * directionMultiplier);
            }

            carMesh.translateZ(currentSpeed);
          } else {
            currentSpeed = 0;
          }
        }
      }
    }

    renderer.render(scene, camera);
  }
</script>
</body>
