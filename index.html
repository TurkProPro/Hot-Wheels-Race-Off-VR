<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
  </style>

  <!-- Three.js ve VRButton Kütüphaneleri -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.19.0/dist/cannon-es.js"></script>
</head>
<body>

<script>
  let scene, camera, renderer, world;
  let carBody, carMesh;

  let isMovingForward = false;
  let isMovingBackward = false;
  let turnValue = 0;

  init();
  animate();

  function init() {
    // 1. Sahne ve Kamera Kurulumu
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    // 2. Renderer ve WebXR Etkinleştirme
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 3. VR/AR Butonunu Ekrana Ekle (Three.js Standart Butonu)
    document.body.appendChild(VRButton.createButton(renderer));

    // Işık
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // 4. CANNON Fizik Dünyası
    world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    // 5. Rip Rod Hitbox (3cm x 2.5cm x 7cm)
    const carWidth = 0.03;
    const carHeight = 0.025;
    const carLength = 0.07;

    const carShape = new CANNON.Box(new CANNON.Vec3(carWidth / 2, carHeight / 2, carLength / 2));
    carBody = new CANNON.Body({ mass: 0.035 });
    carBody.addShape(carShape);
    carBody.position.set(0, 1, -1);
    carBody.angularDamping = 0.6;
    world.addBody(carBody);

    const carGeometry = new THREE.BoxGeometry(carWidth, carHeight, carLength);
    const carMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    carMesh = new THREE.Mesh(carGeometry, carMaterial);
    scene.add(carMesh);

    // 6. Kontrolcüler
    const controller0 = renderer.xr.getController(0);
    const controller1 = renderer.xr.getController(1);
    scene.add(controller0);
    scene.add(controller1);

    controller0.addEventListener('selectstart', () => { isMovingForward = true; });
    controller0.addEventListener('selectend', () => { isMovingForward = false; });
    controller0.addEventListener('squeezestart', () => { isMovingBackward = true; });
    controller0.addEventListener('squeezeend', () => { isMovingBackward = false; });

    controller1.addEventListener('selectstart', () => { isMovingForward = true; });
    controller1.addEventListener('selectend', () => { isMovingForward = false; });
    controller1.addEventListener('squeezestart', () => { isMovingBackward = true; });
    controller1.addEventListener('squeezeend', () => { isMovingBackward = false; });
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render() {
    world.step(1 / 60);

    const session = renderer.xr.getSession();
    turnValue = 0;

    if (session && session.inputSources) {
      for (const source of session.inputSources) {
        if (source.gamepad && source.gamepad.axes.length >= 2) {
          if (Math.abs(source.gamepad.axes[0]) > 0.1) {
            turnValue = source.gamepad.axes[0];
          }
        }
      }
    }

    if (isMovingForward) {
      const localForward = new CANNON.Vec3(0, 0, -0.08);
      const worldForward = carBody.quaternion.vmult(localForward);
      carBody.applyForce(worldForward, carBody.position);
    }
    if (isMovingBackward) {
      const localBackward = new CANNON.Vec3(0, 0, 0.04);
      const worldBackward = carBody.quaternion.vmult(localBackward);
      carBody.applyForce(worldBackward, carBody.position);
    }

    if (Math.abs(turnValue) > 0.1) {
      carBody.angularVelocity.y = turnValue * -3.0;
    }

    carMesh.position.copy(carBody.position);
    carMesh.quaternion.copy(carBody.quaternion);

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
