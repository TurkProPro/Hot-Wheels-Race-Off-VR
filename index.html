<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR - Acceleracers Reverb</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
    #loading-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #00ffcc;
      z-index: 9999;
    }
  </style>

  <!-- Three.js ve GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <button id="start-btn" style="display:none;">HOT WHEELS MR'I BAŞLAT</button>
  <div id="loading-text">Model Arka Planda Yükleniyor...</div>

<script>
  var scene, camera, renderer;
  var carMesh; 
  var loadedReverbModel = null; 

  // Sürüş Değişkenleri
  var currentSpeed = 0;
  var MAX_SPEED_FORWARD = -0.012; 
  var MAX_SPEED_BACKWARD = 0.006;  
  var ACCEL = 0.0003;             
  var FRICTION = 0.96;            
  var BRAKE_FORCE = 0.88;         

  var isThrottlePressed = false;
  var isBrakePressed = false;
  var turnValue = 0;

  // Fizik & Tutma
  var activeGrabber = null; 
  var isJustGrabbed = false;

  var velocity = new THREE.Vector3(0, 0, 0); 
  var angularVelocity = new THREE.Vector3(0, 0, 0); 
  
  var lastControllerPos = new THREE.Vector3(0, 0, 0);
  var lastControllerEuler = new THREE.Euler(0, 0, 0);
  
  var GRAVITY = -9.81;
  var FLOOR_Y = 0.008; 
  var GRAB_RADIUS = 0.08; 

  // Kumandalar, Menü & Leveling
  var leftController = null;
  var rightController = null;
  var isSpawnedAtUser = false;

  var isMenuOpen = false;
  var isLevelingMode = false;
  var menuButtonPressedLastFrame = false;
  var xButtonPressedLastFrame = false;
  var aButtonPressedLastFrame = false;

  // 3D Kare Menü Nesneleri
  var squareMenuMesh;
  var canvasMenu, ctxMenu, textureMenu;

  var startBtn = document.getElementById('start-btn');
  var loadingText = document.getElementById('loading-text');

  // --- MODELİ ÖNDEN YÜKLE ---
  var loader = new THREE.GLTFLoader();

  loader.load('./car_model.glb', function(gltf) {
    loadedReverbModel = gltf.scene;

    // Modelin merkezini (pivot noktasını) tam ortala ki ters döndüğünde yere batmasın
    var bboxInitial = new THREE.Box3().setFromObject(loadedReverbModel);
    var center = new THREE.Vector3();
    bboxInitial.getCenter(center);
    loadedReverbModel.position.sub(center); 

    var wrapperGroup = new THREE.Group();
    wrapperGroup.add(loadedReverbModel);
    loadedReverbModel.rotation.y = Math.PI / 2;

    var bboxScaled = new THREE.Box3().setFromObject(wrapperGroup);
    var currentLength = bboxScaled.max.z - bboxScaled.min.z;
    if ((bboxScaled.max.x - bboxScaled.min.x) > currentLength) {
      currentLength = bboxScaled.max.x - bboxScaled.min.x;
    }

    var targetLength = 0.07; 
    var targetScale = targetLength / currentLength;
    wrapperGroup.scale.set(targetScale, targetScale, targetScale);

    wrapperGroup.traverse(function(child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    loadedReverbModel = wrapperGroup;

    loadingText.style.display = 'none';
    startBtn.style.display = 'block';

  }, function(xhr) {
    if (xhr.total > 0) {
      var percent = Math.round((xhr.loaded / xhr.total) * 100);
      loadingText.innerText = 'Model Hazırlanıyor... %' + percent;
    }
  }, function(error) {
    console.error('GLB Yükleme Hatası:', error);
    loadingText.style.color = '#ff3366';
    loadingText.innerText = 'HATA: "car_model.glb" bulunamadı!';
  });

  // WEBXR BAŞLAT
  startBtn.addEventListener('click', function() {
    if (!navigator.xr) {
      alert('WebXR desteklenmiyor!');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'local-floor', 'bounded-floor']
    }).then(function(session) {
      startBtn.style.display = 'none';
      initThreeJS(session);
    }).catch(function(err) {
      alert('MR Başlatılamadı: ' + err.message);
    });
  });

  // KARE MENÜ DOKUSUNU GÜNCELLEME
  function updateMenuTexture() {
    ctxMenu.fillStyle = 'rgba(15, 15, 20, 0.95)';
    ctxMenu.fillRect(0, 0, 512, 512);

    if (!isLevelingMode) {
      // Normal Menü Görünümü
      ctxMenu.strokeStyle = '#00ffcc';
      ctxMenu.lineWidth = 12;
      ctxMenu.strokeRect(6, 6, 500, 500);

      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 44px sans-serif';
      ctxMenu.textAlign = 'center';
      ctxMenu.fillText('MENÜ', 256, 100);

      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = 'bold 30px sans-serif';
      ctxMenu.fillText('LEVELING (YÜKSEKLİK) İÇİN', 256, 220);
      
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 44px sans-serif';
      ctxMenu.fillText('[ X ] TUŞUNA BAS', 256, 290);

      ctxMenu.fillStyle = '#aaaaaa';
      ctxMenu.font = '24px sans-serif';
      ctxMenu.fillText('Kapatmak için: [ Y ] Tuşu', 256, 420);
    } else {
      // Leveling Modu Görünümü
      ctxMenu.strokeStyle = '#ffcc00';
      ctxMenu.lineWidth = 12;
      ctxMenu.strokeRect(6, 6, 500, 500);

      ctxMenu.fillStyle = '#ffcc00';
      ctxMenu.font = 'bold 40px sans-serif';
      ctxMenu.textAlign = 'center';
      ctxMenu.fillText('LEVELING MODU', 256, 90);

      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '28px sans-serif';
      ctxMenu.fillText('Sol Stick İle', 256, 180);
      ctxMenu.fillText('Yüksekliği Ayarla', 256, 220);

      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 36px sans-serif';
      ctxMenu.fillText('Kaydet ve Çık:', 256, 330);
      ctxMenu.fillText('[ X ] TUŞUNA BAS', 256, 390);
    }

    textureMenu.needsUpdate = true;
  }

  function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    // Işıklar
    var light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.8);
    scene.add(light);
    var dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    // Hitbox & Model
    var hitboxGeometry = new THREE.BoxGeometry(0.04, 0.03, 0.07);
    var hitboxMaterial = new THREE.MeshBasicMaterial({ visible: false });
    carMesh = new THREE.Mesh(hitboxGeometry, hitboxMaterial);
    carMesh.position.set(0, FLOOR_Y + 0.015, -0.4);
    scene.add(carMesh);

    if (loadedReverbModel) {
      carMesh.add(loadedReverbModel);
    }

    // Kumandalar
    leftController = renderer.xr.getController(0);
    scene.add(leftController);

    rightController = renderer.xr.getController(1);
    scene.add(rightController);

    // Kare Menü 3D Nesnesi
    canvasMenu = document.createElement('canvas');
    canvasMenu.width = 512;
    canvasMenu.height = 512;
    ctxMenu = canvasMenu.getContext('2d');
    textureMenu = new THREE.CanvasTexture(canvasMenu);

    updateMenuTexture();

    var planeGeo = new THREE.PlaneGeometry(0.15, 0.15); 
    var planeMat = new THREE.MeshBasicMaterial({ map: textureMenu, side: THREE.DoubleSide, transparent: true });
    squareMenuMesh = new THREE.Mesh(planeGeo, planeMat);

    squareMenuMesh.position.set(0, 0.12, -0.05);
    squareMenuMesh.rotation.x = -Math.PI / 6; 
    squareMenuMesh.visible = false;

    leftController.add(squareMenuMesh);

    renderer.setAnimationLoop(render);
  }

  // Arabayı oyuncunun önüne düz şekilde ışınlama fonksiyonu (Reset/Teleport)
  function teleportCarToUser() {
    if (!camera || !carMesh) return;

    var camPos = new THREE.Vector3();
    var camQuat = new THREE.Quaternion();
    camera.getWorldPosition(camPos);
    camera.getWorldQuaternion(camQuat);

    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
    forward.y = 0;
    forward.normalize();

    carMesh.position.copy(camPos).add(forward.clone().multiplyScalar(0.5));
    carMesh.position.y = FLOOR_Y + 0.015;

    var angle = Math.atan2(forward.x, forward.z);
    carMesh.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle + Math.PI);

    velocity.set(0, 0, 0);
    angularVelocity.set(0, 0, 0);
    currentSpeed = 0;
    activeGrabber = null;
  }

  var lastTime = performance.now();

  function render(time, frame) {
    var session = renderer.xr.getSession();
    var delta = (time - lastTime) / 1000;
    if (delta > 0.1) delta = 0.1;
    lastTime = time;

    // Oyuncu Hizalama
    if (!isSpawnedAtUser && camera) {
      var camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
        teleportCarToUser();
        isSpawnedAtUser = true;
      }
    }

    var leftTriggerPressed = false;
    var rightTriggerPressed = false;

    if (session && session.inputSources) {
      isThrottlePressed = false;
      isBrakePressed = false;
      turnValue = 0;

      for (var i = 0; i < session.inputSources.length; i++) {
        var source = session.inputSources[i];
        if (!source.gamepad) continue;

        var btns = source.gamepad.buttons;

        // SAĞ KUMANDA (0: Trigger, 1: Grip, 4: A Tuşu)
        if (source.handedness === 'right') {
          if (btns[0] && btns[0].value > 0.1) {
            rightTriggerPressed = true;
            if (!activeGrabber && !isMenuOpen && !isLevelingMode) isThrottlePressed = true;
          }
          if (btns[1] && btns[1].value > 0.1) {
            if (!activeGrabber && !isMenuOpen && !isLevelingMode) isBrakePressed = true;
          }

          // A Tuşu Kontrolü (buttons[4] -> Sağ Kumanda A Tuşu)
          var aBtnPressed = (btns[4] && btns[4].pressed);
          if (aBtnPressed && !aButtonPressedLastFrame) {
            teleportCarToUser(); 
          }
          aButtonPressedLastFrame = aBtnPressed;
        }

        // SOL KUMANDA (4: X Tuşu, 5: Y Tuşu)
        if (source.handedness === 'left') {
          var axes = source.gamepad.axes;

          // 1. Y Tuşu (buttons[5] -> Sol Kumandadaki Y Tuşu) ile Menü Aç / Kapat
          var yBtnPressed = (btns[5] && btns[5].pressed);
          if (yBtnPressed && !menuButtonPressedLastFrame) {
            isMenuOpen = !isMenuOpen;
            if (!isMenuOpen) {
              isLevelingMode = false;
            }
            squareMenuMesh.visible = isMenuOpen;
            updateMenuTexture();
          }
          menuButtonPressedLastFrame = yBtnPressed;

          // 2. X Tuşu (buttons[4] -> Sol Kumandadaki X Tuşu) ile Leveling Modu Aç / Kapat
          var xBtnPressed = (btns[4] && btns[4].pressed);
          if (xBtnPressed && !xButtonPressedLastFrame && isMenuOpen) {
            isLevelingMode = !isLevelingMode; 
            updateMenuTexture();
          }
          xButtonPressedLastFrame = xBtnPressed;

          // 3. Leveling Modunda Yükseklik Ayarı (Sol Stick Y Ekseni)
          if (isLevelingMode && axes && axes.length > 1) {
            var axisY = axes.length >= 4 ? axes[3] : axes[1];
            if (Math.abs(axisY) > 0.1) {
              FLOOR_Y -= axisY * 0.002; 
              if (!activeGrabber) {
                carMesh.position.y = FLOOR_Y + 0.015;
              }
            }
          } 
          // 4. Normal Direksiyon Kontrolü
          else if (!isMenuOpen && axes && axes.length > 0) {
            var axisX = axes.length >= 4 ? axes[2] : axes[0];
            if (Math.abs(axisX) > 0.05) {
              turnValue = axisX;
            }
          }

          if (btns[0] && btns[0].value > 0.1) {
            leftTriggerPressed = true;
          }
        }
      }
    }

    // TUTMA TESPİTİ
    var leftPos = new THREE.Vector3();
    var rightPos = new THREE.Vector3();

    if (leftController) leftController.getWorldPosition(leftPos);
    if (rightController) rightController.getWorldPosition(rightPos);

    var distLeft = leftPos.distanceTo(carMesh.position);
    var distRight = rightPos.distanceTo(carMesh.position);

    var prevGrabber = activeGrabber;

    if (leftTriggerPressed && (distLeft < GRAB_RADIUS || activeGrabber === 'left')) {
      activeGrabber = 'left';
    } else if (rightTriggerPressed && (distRight < GRAB_RADIUS || activeGrabber === 'right')) {
      activeGrabber = 'right';
    } else {
      activeGrabber = null;
    }

    if (activeGrabber && !prevGrabber) {
      isJustGrabbed = true;
    }

    // ELDE TUTULUYORSA
    if (activeGrabber) {
      var activeController = (activeGrabber === 'left') ? leftController : rightController;

      if (activeController) {
        var controllerPos = new THREE.Vector3();
        var controllerQuat = new THREE.Quaternion();

        activeController.getWorldPosition(controllerPos);
        activeController.getWorldQuaternion(controllerQuat);

        if (isJustGrabbed) {
          lastControllerPos.copy(controllerPos);
          lastControllerEuler.setFromQuaternion(controllerQuat, 'XYZ');
          velocity.set(0, 0, 0);
          angularVelocity.set(0, 0, 0);
          currentSpeed = 0;
          isJustGrabbed = false;
        } else if (delta > 0) {
          velocity.subVectors(controllerPos, lastControllerPos).divideScalar(delta);
          lastControllerPos.copy(controllerPos);

          var currentEuler = new THREE.Euler().setFromQuaternion(controllerQuat, 'XYZ');
          angularVelocity.set(
            (currentEuler.x - lastControllerEuler.x) / delta,
            (currentEuler.y - lastControllerEuler.y) / delta,
            (currentEuler.z - lastControllerEuler.z) / delta
          );
          lastControllerEuler.copy(currentEuler);
        }

        carMesh.position.copy(controllerPos);
        carMesh.quaternion.copy(controllerQuat);
      }
    } 
    // SERBEST DÜŞÜŞ VE FİZİK
    else {
      var minGroundY = FLOOR_Y + 0.015;

      if (carMesh.position.y > minGroundY) {
        velocity.y += GRAVITY * delta;

        carMesh.rotation.x += angularVelocity.x * delta;
        carMesh.rotation.y += angularVelocity.y * delta;
        carMesh.rotation.z += angularVelocity.z * delta;
      }

      carMesh.position.x += velocity.x * delta;
      carMesh.position.y += velocity.y * delta;
      carMesh.position.z += velocity.z * delta;

      // ZEMİN TEMASI
      if (carMesh.position.y <= minGroundY) {
        carMesh.position.y = minGroundY;
        velocity.y = 0;

        angularVelocity.multiplyScalar(0.05);

        velocity.x *= 0.8;
        velocity.z *= 0.8;
      }

      var upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(carMesh.quaternion);
      var isUprightAndOnGround = upVector.y > 0.65;

      if (carMesh.position.y <= minGroundY + 0.005 && isUprightAndOnGround && !isMenuOpen && !isLevelingMode) {
        if (isThrottlePressed) {
          if (currentSpeed > MAX_SPEED_FORWARD) {
            currentSpeed -= ACCEL;
          }
        } 
        else if (isBrakePressed) {
          if (currentSpeed < -0.0005) {
            currentSpeed *= BRAKE_FORCE; 
          } 
          else if (currentSpeed < MAX_SPEED_BACKWARD) {
            currentSpeed += ACCEL * 0.6; 
          }
        } 
        else {
          currentSpeed *= FRICTION;
          if (Math.abs(currentSpeed) < 0.00005) currentSpeed = 0;
        }

        if (currentSpeed !== 0 && Math.abs(turnValue) > 0.05) {
          var directionMultiplier = currentSpeed < 0 ? 1 : -1;
          carMesh.rotateY(-turnValue * 0.05 * directionMultiplier);
        }

        carMesh.translateZ(currentSpeed);
      } else {
        currentSpeed = 0;
      }
    }

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
